<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Add Student</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<header class="navbar">

<div class="logo">🎓 Student Grade Tracker</div>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="add-student.html" class="active">Add Student</a>
    <a href="statistics.html">Statistics</a>
    <a href="report.html">Reports</a>
</nav>

</header>

<main class="container">

<div class="form-container">

    <h1>Add Student</h1>

    <p>Enter student information below.</p>

    <form id="studentForm">

        <label>Student ID</label>
        <input
            type="text"
            id="studentId"
            placeholder="Example: ST001"
            required
        >

        <label>Student Name</label>
        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
            required
        >

        <label>Subject</label>
        <input
            type="text"
            id="subject"
            placeholder="Example: Mathematics"
            required
        >

        <label>Score</label>
        <input
            type="number"
            id="score"
            min="0"
            max="100"
            placeholder="0 - 100"
            required
        >

        <button type="submit" class="btn">
            Save Student
        </button>

    </form>

    <p id="message"></p>

</div>

</main>

<script src="script.js"></script>

</body> </html>
